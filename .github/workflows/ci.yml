name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: Tolemak/.github/.github/workflows/php-ci.yml@v1
    with:
      php-version: "8.3"
      extensions: mongodb-2.5.2, ctype, iconv
      cs-tool: phpcs
      mongodb-version: "8.0"
      env: |
        APP_ENV=test
        DATABASE_URI=mongodb://127.0.0.1:27017/lecture-backend-test
      pre-test-command: php bin/console lexik:jwt:generate-keypair --skip-if-exists

  docker:
    name: Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --pull --tag lecture-backend:ci .
