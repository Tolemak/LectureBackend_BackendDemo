services:
  app:
    build: ./
    container_name: lecture-backend
    volumes:
      - .:/app:rw
    ports:
      - 0.0.0.0:10990:80/tcp
    depends_on:
      - database

  database:
    # Official image, not a Bitnami tag — Bitnami has a history of pruning
    # older tags out from under pinned builds (this repo's previous pin,
    # bitnami/mongodb:5.0.23, no longer resolves at all).
    image: mongo:5.0
    container_name: lecture-backend-database
    volumes:
      - mongodb:/data/db
    ports:
      - 27019:27017

volumes:
  mongodb:
